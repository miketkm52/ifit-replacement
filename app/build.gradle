plugins { id 'com.android.application' }
android {
    namespace 'uk.eba.ifitrecon'
    compileSdk 34
    defaultConfig {
        applicationId 'uk.eba.ifitrecon'
        minSdk 21
        //noinspection ExpiredTargetSdkVersion  (sideloaded only; keeps legacy storage access)
        targetSdk 29
        versionCode 6
        versionName '0.6'
    }
    signingConfigs {
        test { storeFile file('test.keystore'); storePassword 'ifitrecon'; keyAlias 'test'; keyPassword 'ifitrecon' }
    }
    buildTypes { debug { signingConfig signingConfigs.test } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/*'] } }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'io.grpc:grpc-binder:1.68.1'
    implementation 'io.grpc:grpc-stub:1.68.1'
}
